<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">to_bitmask decision flow</title>
  <desc id="desc">Start from compare or classify, decide whether a scalar mask is required, and otherwise choose a consumer-oriented path such as count, first-hit, positions, selected data, or predicate algebra.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f3b52"/>
    </marker>
    <style>
      .bg { fill: #f7f8fb; }
      .box { fill: #ffffff; stroke: #2f3b52; stroke-width: 2; rx: 14; ry: 14; }
      .main { fill: #eaf1ff; }
      .compat { fill: #fff4e8; }
      .panel { fill: #eef6ef; stroke: #2f3b52; stroke-width: 2; rx: 16; ry: 16; }
      .card { fill: #ffffff; stroke: #5b6985; stroke-width: 1.8; rx: 12; ry: 12; }
      .line { stroke: #2f3b52; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .label { font: 600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #1f2937; text-anchor: middle; }
      .small { font: 500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #364152; text-anchor: middle; }
      .panel-title { font: 700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #1f2937; }
      .hint { font: 600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475467; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="760"/>

  <rect class="box main" x="400" y="36" width="300" height="90"/>
  <text class="label" x="550" y="74">compare / classify</text>
  <text class="small" x="550" y="104">先生成 predicate</text>

  <rect class="box" x="400" y="170" width="300" height="92"/>
  <text class="label" x="550" y="208">是否必须交出</text>
  <text class="small" x="550" y="238">标量 mask？</text>

  <path class="line" d="M550 126 V170"/>

  <rect class="box compat" x="70" y="320" width="270" height="96"/>
  <text class="label" x="205" y="360">to_scalar_mask(pred)</text>
  <text class="small" x="205" y="390">走边界适配路径</text>

  <rect class="panel" x="410" y="320" width="620" height="390"/>
  <text class="panel-title" x="440" y="360">按消费目标分流</text>

  <path class="line" d="M460 262 C410 278 315 298 340 320"/>
  <path class="line" d="M640 262 C700 280 760 296 760 320"/>
  <text class="hint" x="375" y="292">是</text>
  <text class="hint" x="680" y="292">否</text>

  <rect class="card" x="450" y="395" width="250" height="78"/>
  <text class="small" x="575" y="426">any / all / count</text>
  <text class="small" x="575" y="452">svptest_any / svcntp</text>

  <rect class="card" x="740" y="395" width="250" height="78"/>
  <text class="small" x="865" y="426">first hit</text>
  <text class="small" x="865" y="452">svpfirst / svbrkb + svcntp</text>

  <rect class="card" x="450" y="505" width="250" height="78"/>
  <text class="small" x="575" y="536">all hit positions</text>
  <text class="small" x="575" y="562">svpfirst / svpnext</text>

  <rect class="card" x="740" y="505" width="250" height="78"/>
  <text class="small" x="865" y="536">selected data</text>
  <text class="small" x="865" y="562">pfirst/pnext 或 byte compact</text>

  <rect class="card" x="595" y="615" width="250" height="78"/>
  <text class="small" x="720" y="646">predicate algebra</text>
  <text class="small" x="720" y="672">继续留在 predicate 域</text>
</svg>
